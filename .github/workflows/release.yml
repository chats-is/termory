name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate the ENTIRE release on the full test suite (frontend vitest + build
  # AND the 3-OS Rust matrix, reused from test.yml). A red test aborts here
  # — before any draft is created, anything is built, or anything is
  # published — so a broken commit can never ship a release.
  test:
    uses: ./.github/workflows/test.yml

  # Create the draft release ONCE up front so the platform matrix below
  # uploads into a single release. (Previously every matrix job ran
  # tauri-action with releaseDraft + tagName, which raced and produced
  # duplicate drafts with the assets split across them.)
  create-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      # The same changelog text, exposed so the build matrix can hand it to
      # tauri-action's `releaseBody` — that's what lands in latest.json's
      # `notes`, which the in-app UpdateDialog renders. Without it `notes` is
      # "" and the dialog shows no changelog.
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      # Full history + tags so release-notes.sh can diff against the previous
      # tag and build the conventional-commit changelog.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Full notes → the GitHub Release page body.
          bash .github/release-notes.sh "$tag" > release-notes.md
          # Changelog-only → latest.json's `notes` (the in-app UpdateDialog).
          # Exposed as a multiline job output via a heredoc delimiter (a random
          # marker so the changelog body can't collide with it).
          {
            delim="RELEASE_NOTES_$RANDOM$RANDOM"
            echo "body<<$delim"
            bash .github/release-notes.sh "$tag" --changelog
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: actions/github-script@v8
        id: create
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Termory ${tag}`,
              body: fs.readFileSync('release-notes.md', 'utf8'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    name: Build ${{ matrix.platform }} ${{ matrix.args }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-15
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci

      # releaseId points every matrix job at the single draft created
      # above, so tauri-action only uploads (no per-job release creation).
      #
      # `continue-on-error` + the conditional retry below implement a
      # one-shot retry for the macOS DMG-bundling flake: bundle_dmg.sh
      # drives Finder via AppleScript and detaches with hdiutil, both
      # of which intermittently fail on shared macOS runners (osascript
      # timeout / "Resource busy" race). A rerun of the same commit
      # always clears it (v0.2.17 confirmed). The retry is macOS-only —
      # other platforms don't flake, so their failures are real and
      # surface via the final guard step.
      - name: Build & upload
        id: build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: provide these GitHub Secrets to sign update
          # artifacts so the in-app updater accepts them. Generate the
          # key pair locally with `npm run tauri signer generate -- -w
          # ~/.tauri/termory.key` and paste the public key into
          # tauri.conf.json's `plugins.updater.pubkey`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Populates latest.json's `notes` (the in-app changelog); harmless
          # for the platform installers.
          releaseBody: ${{ needs.create-release.outputs.release_body }}
          args: ${{ matrix.args }}

      # Same step again (GitHub Actions has no YAML anchors and `uses:`
      # steps can't be wrapped in a retry action) — keep env/with in
      # sync with the step above. The Rust target dir from the first
      # attempt is still on the runner, so the retry mostly redoes the
      # bundling, not the compile.
      - name: Build & upload (macOS flake retry)
        if: steps.build.outcome == 'failure' && runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.release_body }}
          args: ${{ matrix.args }}

      # Re-raise non-macOS failures swallowed by continue-on-error (the
      # macOS path either succeeded on retry or already failed the job
      # through the retry step itself).
      - name: Fail on non-macOS build failure
        if: steps.build.outcome == 'failure' && runner.os != 'macOS'
        run: exit 1

  # Every platform build uploaded into the draft → flip it to published so
  # the release goes live and …/releases/latest/download/latest.json
  # resolves for the in-app updater. `needs: build` gates this on ALL matrix
  # jobs succeeding, so a partial/failed build leaves the release a draft
  # (manually publishable) instead of shipping an incomplete release.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (un-draft)
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
