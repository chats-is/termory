[package]
name = "termory"
version = "1.0.1"
description = "Local history browser for AI CLIs (Claude Code, Codex, Gemini, OpenCode), with per-app API provider switching: the four CLIs plus Claude Desktop (a Codex switch covers its CLI and app together; Claude Desktop is managed separately from Claude Code)"
authors = ["John Ma"]
license = "MIT"
edition = "2021"

[lib]
name = "termory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Termory"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: write JSON keys in insertion order (not alphabetical),
# so opencode.json's `models` keeps the primary `model` first and merges
# into user configs preserve their existing key order.
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2.9.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.0"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
toml = "1.1.2"
toml_edit = "0.22"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
base64 = "0.22"
log = "0.4"
os_info = "3"
tauri-plugin-autostart = "2"

# Process-liveness probe for Claude session PID files, so a crashed
# session's residual `<pid>.json` doesn't surface a stale status. Unix:
# kill(pid, 0); Windows: OpenProcess.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
